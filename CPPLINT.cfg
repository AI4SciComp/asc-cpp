# Stop searching for parent configurations.
set noparent

linelength=100

# ASC follows its inherited MdeCpp policy for these deliberate deviations.
filter=-build/c++11
filter=-build/header_guard
filter=-build/pragma_once
filter=-build/include_subdir
filter=-legal/copyright
filter=-runtime/references
filter=-whitespace/newline
filter=-readability/braces

exclude_files=docs/*
exclude_files=config/*
