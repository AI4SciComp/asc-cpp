name: CodeQL

on:
  workflow_call:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: "codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out ASCCpp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      - name: Configure and build
        shell: bash
        run: |
          build="$RUNNER_TEMP/codeql"
          cmake -S . -B "$build" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DASC_CPP_BUILD_TESTING=ON \
            -DASC_CPP_ENABLE_CUDA=OFF \
            -DASC_CPP_WARNINGS_AS_ERRORS=ON
          cmake --build "$build" --parallel 2
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          category: /language:c-cpp
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-cpp-failure
          path: |
            ${{ runner.temp }}/codeql/CMakeFiles/CMakeOutput.log
            ${{ runner.temp }}/codeql/Testing/**
          if-no-files-found: warn
