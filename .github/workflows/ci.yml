name: CI

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  linux-gcc-minimum:
    name: Linux / GCC 11 / CMake 3.25 / ${{ matrix.config }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Check out ASCCpp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: asc-cpp
          persist-credentials: false
      - name: Install exact minimum CMake
        shell: bash
        run: |
          archive="$RUNNER_TEMP/cmake-3.25.0-linux-x86_64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/Kitware/CMake/releases/download/v3.25.0/cmake-3.25.0-linux-x86_64.tar.gz
          echo "ac634d6f0a81d7089adc7be5acff66a6bee3b08615f9a947858ce92a9ef59c8b  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/cmake-3.25.0"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/cmake-3.25.0"
          echo "$RUNNER_TEMP/cmake-3.25.0/bin" >> "$GITHUB_PATH"
      - name: Report tools
        run: |
          cmake --version
          ctest --version
          g++ --version
      - name: Configure, build, and test
        shell: bash
        run: |
          build="$RUNNER_TEMP/gcc11-${{ matrix.config }}"
          cmake -S asc-cpp -B "$build" \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=ON \
            -DASC_CPP_BUILD_TESTING=ON \
            -DASC_CPP_ENABLE_CUDA=OFF \
            -DASC_CPP_INSTALL=ON \
            -DASC_CPP_WARNINGS_AS_ERRORS=ON
          cmake --build "$build" --parallel 2
          ctest --test-dir "$build" --parallel 2 --no-tests=error \
            --output-on-failure --output-junit "$build/ctest.xml"
          python3 asc-cpp/tools/ci/check_ctest_junit.py "$build/ctest.xml"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcc11-cmake325-${{ matrix.config }}-failure
          path: |
            ${{ runner.temp }}/gcc11-${{ matrix.config }}/Testing/**
            ${{ runner.temp }}/gcc11-${{ matrix.config }}/ctest.xml
            ${{ runner.temp }}/gcc11-${{ matrix.config }}/asc-cpp-test-workspaces/**
          if-no-files-found: warn

  linux-gcc-current:
    name: Linux / GCC 14 / Release / ${{ matrix.linkage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - linkage: static
            shared: "OFF"
          - linkage: shared
            shared: "ON"
    steps:
      - name: Check out ASCCpp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: asc-cpp
          persist-credentials: false
      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
      - name: Configure, build, and test
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          build="$RUNNER_TEMP/gcc14-${{ matrix.linkage }}"
          cmake -S asc-cpp -B "$build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DBUILD_TESTING=ON \
            -DASC_CPP_BUILD_TESTING=ON \
            -DASC_CPP_ENABLE_CUDA=OFF \
            -DASC_CPP_INSTALL=ON \
            -DASC_CPP_WARNINGS_AS_ERRORS=ON
          cmake --build "$build" --parallel 2
          ctest --test-dir "$build" --parallel 2 --no-tests=error \
            --output-on-failure --output-junit "$build/ctest.xml"
          python3 asc-cpp/tools/ci/check_ctest_junit.py "$build/ctest.xml"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcc14-release-${{ matrix.linkage }}-failure
          path: |
            ${{ runner.temp }}/gcc14-${{ matrix.linkage }}/Testing/**
            ${{ runner.temp }}/gcc14-${{ matrix.linkage }}/ctest.xml
            ${{ runner.temp }}/gcc14-${{ matrix.linkage }}/asc-cpp-test-workspaces/**
          if-no-files-found: warn

  linux-clang-current:
    name: Linux / Clang 18 / ${{ matrix.config }} / ${{ matrix.linkage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            linkage: static
            shared: "OFF"
          - config: Release
            linkage: static
            shared: "OFF"
          - config: Debug
            linkage: shared
            shared: "ON"
          - config: Release
            linkage: shared
            shared: "ON"
    steps:
      - name: Check out ASCCpp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: asc-cpp
          persist-credentials: false
      - name: Install Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
      - name: Configure, build, and test
        shell: bash
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          build="$RUNNER_TEMP/clang18-${{ matrix.config }}-${{ matrix.linkage }}"
          cmake -S asc-cpp -B "$build" \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DBUILD_TESTING=ON \
            -DASC_CPP_BUILD_TESTING=ON \
            -DASC_CPP_ENABLE_CUDA=OFF \
            -DASC_CPP_INSTALL=ON \
            -DASC_CPP_WARNINGS_AS_ERRORS=ON
          cmake --build "$build" --parallel 2
          ctest --test-dir "$build" --parallel 2 --no-tests=error \
            --output-on-failure --output-junit "$build/ctest.xml"
          python3 asc-cpp/tools/ci/check_ctest_junit.py "$build/ctest.xml"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clang18-${{ matrix.config }}-${{ matrix.linkage }}-failure
          path: |
            ${{ runner.temp }}/clang18-${{ matrix.config }}-${{ matrix.linkage }}/Testing/**
            ${{ runner.temp }}/clang18-${{ matrix.config }}-${{ matrix.linkage }}/ctest.xml
            ${{ runner.temp }}/clang18-${{ matrix.config }}-${{ matrix.linkage }}/asc-cpp-test-workspaces/**
          if-no-files-found: warn

  clang-quality:
    name: Clang 18 / format and full tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out ASCCpp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: asc-cpp
          persist-credentials: false
      - name: Install Clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18
      - name: Check formatting
        working-directory: asc-cpp
        run: |
          git ls-files '*.h' '*.cc' '*.cu' -z | \
            xargs -0 clang-format-18 --dry-run --Werror
      - name: Configure and run full tidy
        shell: bash
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          build="$RUNNER_TEMP/clang18-tidy"
          cmake -S asc-cpp -B "$build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18 \
            -DBUILD_TESTING=OFF \
            -DASC_CPP_BUILD_TESTING=OFF \
            -DASC_CPP_ENABLE_CUDA=OFF \
            -DASC_CPP_WARNINGS_AS_ERRORS=ON
          cmake --build "$build" --parallel 2
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clang18-quality-failure
          path: |
            ${{ runner.temp }}/clang18-tidy/compile_commands.json
            ${{ runner.temp }}/clang18-tidy/Testing/**
          if-no-files-found: warn

  sanitizers:
    name: Linux / Clang 18 / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            options: -DASC_CPP_ENABLE_ADDRESS_SANITIZER=ON -DASC_CPP_ENABLE_UNDEFINED_SANITIZER=ON
            include_label: .*
            exclude_label: package|consumer
          - name: lsan
            options: -DASC_CPP_ENABLE_LEAK_SANITIZER=ON
            include_label: .*
            exclude_label: package|consumer
          - name: tsan
            options: -DASC_CPP_ENABLE_THREAD_SANITIZER=ON
            include_label: concurrency
            exclude_label: package|consumer|benchmark
    steps:
      - name: Check out ASCCpp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: asc-cpp
          persist-credentials: false
      - name: Install Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
      - name: Configure, build, and test
        shell: bash
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          build="$RUNNER_TEMP/${{ matrix.name }}"
          cmake -S asc-cpp -B "$build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=ON \
            -DASC_CPP_BUILD_TESTING=ON \
            -DASC_CPP_ENABLE_CUDA=OFF \
            -DASC_CPP_WARNINGS_AS_ERRORS=ON \
            ${{ matrix.options }}
          cmake --build "$build" --parallel 2
          ctest --test-dir "$build" --parallel 2 --no-tests=error \
            --label-regex '${{ matrix.include_label }}' \
            --label-exclude '${{ matrix.exclude_label }}' \
            --output-on-failure --output-junit "$build/ctest.xml"
          python3 asc-cpp/tools/ci/check_ctest_junit.py "$build/ctest.xml"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}-failure
          path: |
            ${{ runner.temp }}/${{ matrix.name }}/Testing/**
            ${{ runner.temp }}/${{ matrix.name }}/ctest.xml
          if-no-files-found: warn

  windows-msvc:
    name: Windows / MSVC / ${{ matrix.linkage }} / Debug and Release
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - linkage: static
            shared: "OFF"
          - linkage: shared
            shared: "ON"
    steps:
      - name: Check out ASCCpp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: asc-cpp
          persist-credentials: false
      - name: Configure, build, and test both configurations
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "msvc-${{ matrix.linkage }}"
          cmake -S asc-cpp -B $build -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} `
            -DBUILD_TESTING=ON `
            -DASC_CPP_BUILD_TESTING=ON `
            -DASC_CPP_ENABLE_CUDA=OFF `
            -DASC_CPP_INSTALL=ON `
            -DASC_CPP_WARNINGS_AS_ERRORS=ON
          foreach ($config in @("Debug", "Release")) {
            cmake --build $build --config $config --parallel 2
            ctest --test-dir $build -C $config --parallel 2 --no-tests=error `
              --output-on-failure --output-junit "$build/ctest-$config.xml"
            python asc-cpp/tools/ci/check_ctest_junit.py "$build/ctest-$config.xml"
          }
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msvc-${{ matrix.linkage }}-failure
          path: |
            ${{ runner.temp }}/msvc-${{ matrix.linkage }}/Testing/**
            ${{ runner.temp }}/msvc-${{ matrix.linkage }}/ctest-*.xml
            ${{ runner.temp }}/msvc-${{ matrix.linkage }}/asc-cpp-test-workspaces/**
          if-no-files-found: warn

  macos-appleclang:
    name: macOS / AppleClang / ${{ matrix.config }} / ${{ matrix.linkage }}
    runs-on: macos-15
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            linkage: static
            shared: "OFF"
          - config: Release
            linkage: static
            shared: "OFF"
          - config: Debug
            linkage: shared
            shared: "ON"
          - config: Release
            linkage: shared
            shared: "ON"
    steps:
      - name: Check out ASCCpp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: asc-cpp
          persist-credentials: false
      - name: Configure, build, and test
        shell: bash
        run: |
          build="$RUNNER_TEMP/appleclang-${{ matrix.config }}-${{ matrix.linkage }}"
          cmake -S asc-cpp -B "$build" \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DBUILD_TESTING=ON \
            -DASC_CPP_BUILD_TESTING=ON \
            -DASC_CPP_ENABLE_CUDA=OFF \
            -DASC_CPP_INSTALL=ON \
            -DASC_CPP_WARNINGS_AS_ERRORS=ON
          cmake --build "$build" --parallel 2
          ctest --test-dir "$build" --parallel 2 --no-tests=error \
            --output-on-failure --output-junit "$build/ctest.xml"
          python3 asc-cpp/tools/ci/check_ctest_junit.py "$build/ctest.xml"
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: appleclang-${{ matrix.config }}-${{ matrix.linkage }}-failure
          path: |
            ${{ runner.temp }}/appleclang-${{ matrix.config }}-${{ matrix.linkage }}/Testing/**
            ${{ runner.temp }}/appleclang-${{ matrix.config }}-${{ matrix.linkage }}/ctest.xml
            ${{ runner.temp }}/appleclang-${{ matrix.config }}-${{ matrix.linkage }}/asc-cpp-test-workspaces/**
          if-no-files-found: warn

  package-docs-examples:
    name: Package, contracts, examples, and strict Doxygen
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out ASCCpp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: asc-cpp
          persist-credentials: false
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          doxygen --version | grep '^1\.9\.8$'
          dot -V
      - name: Build independent strict documentation evidence
        shell: bash
        run: |
          build="$RUNNER_TEMP/package-docs"
          cmake \
            -DASC_CPP_DOCUMENTATION_SOURCE_DIR="$GITHUB_WORKSPACE/asc-cpp" \
            -DASC_CPP_DOCUMENTATION_BUILD_DIR="$build" \
            -DASC_CPP_DOCUMENTATION_VERSION=0.9.0 \
            -DASC_CPP_DOCUMENTATION_DOXYGEN_EXECUTABLE="$(command -v doxygen)" \
            -P asc-cpp/tools/documentation/BuildDoxygen.cmake
          python3 asc-cpp/tools/documentation/check_doxygen.py \
            --source asc-cpp \
            --build "$build" \
            --xml "$build/docs/doxygen/xml" \
            --html "$build/docs/doxygen/html" \
            --tagfile "$build/docs/doxygen/ASCCpp.tag" \
            --warnings "$build/docs/doxygen/doxygen-warnings.log"
          python3 asc-cpp/tools/documentation/check_links.py --root asc-cpp
      - name: Build and verify package evidence
        shell: bash
        run: |
          build="$RUNNER_TEMP/package-docs"
          install="$RUNNER_TEMP/ASCCpp install prefix"
          cmake -S asc-cpp -B "$build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$install" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DASC_CPP_BUILD_TESTING=ON \
            -DASC_CPP_BUILD_DOCUMENTATION=ON \
            -DASC_CPP_ENABLE_CUDA=OFF \
            -DASC_CPP_INSTALL=ON \
            -DASC_CPP_WARNINGS_AS_ERRORS=ON
          cmake --build "$build" --parallel 2
          ctest --test-dir "$build" --parallel 2 --no-tests=error \
            --label-regex 'architecture|contracts|package|consumer|relocation|provenance|documentation|examples' \
            --output-on-failure --output-junit "$build/ctest.xml"
          python3 asc-cpp/tools/ci/check_ctest_junit.py "$build/ctest.xml"
          cmake --build "$build" --target asc_cpp_docs_check --parallel 2
          cmake --install "$build"
      - name: Upload documentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ASCCpp-0.9.0-documentation
          path: |
            ${{ runner.temp }}/package-docs/docs/doxygen/html/**
            ${{ runner.temp }}/package-docs/docs/doxygen/xml/**
            ${{ runner.temp }}/package-docs/docs/doxygen/ASCCpp.tag
            ${{ runner.temp }}/package-docs/docs/doxygen/doxygen-warnings.log
            ${{ runner.temp }}/package-docs/ctest.xml
          if-no-files-found: error
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-docs-examples-failure
          path: |
            ${{ runner.temp }}/package-docs/Testing/**
            ${{ runner.temp }}/package-docs/ctest.xml
            ${{ runner.temp }}/package-docs/asc-cpp-test-workspaces/**
            ${{ runner.temp }}/package-docs/docs/doxygen/doxygen-warnings.log
          if-no-files-found: warn
