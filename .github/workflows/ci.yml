name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

env:
  ASC_CMAKE_COMMIT: 8a7dcbad3a97267cce59810aff24de800a3497a7

jobs:
  linux-gcc-cmake-min:
    name: Linux / GCC 11 / CMake 3.25 / Debug and Release
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out asc-cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: asc-cpp
          persist-credentials: false
      - name: Check out exact private asc-cmake release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AI4SciComp/asc-cmake
          ref: ${{ env.ASC_CMAKE_COMMIT }}
          token: ${{ secrets.ASC_CMAKE_READ_TOKEN }}
          path: asc-cmake
          persist-credentials: false
      - name: Install CMake 3.25
        run: |
          python3 -m venv cmake-venv
          cmake-venv/bin/pip install cmake==3.25.0
          echo "$PWD/cmake-venv/bin" >> "$GITHUB_PATH"
      - name: Report tools and verify asc-cmake
        run: |
          uname -a
          cmake --version
          ctest --version
          gcc --version
          g++ --version
          test "$(git -C asc-cmake rev-parse HEAD)" = "$ASC_CMAKE_COMMIT"
      - name: Configure asc-cmake build-tree package
        run: |
          cmake -S asc-cmake -B build/asc-cmake \
            -DBUILD_TESTING=OFF \
            -DASC_CMAKE_BUILD_TESTING=OFF \
            -DASC_CMAKE_INSTALL=OFF
      - name: Configure, build, and test Debug
        run: |
          cmake -S asc-cpp -B build/gcc-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DASC_CPP_BUILD_TESTING=ON \
            -DASC_CPP_ENABLE_CUDA=OFF \
            -DASC_CPP_WARNINGS_AS_ERRORS=ON \
            -DASCCMake_DIR="$PWD/build/asc-cmake"
          cmake --build build/gcc-debug --parallel 2
          ctest --test-dir build/gcc-debug --output-on-failure
      - name: Configure, build, and test Release
        run: |
          cmake -S asc-cpp -B build/gcc-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DASC_CPP_BUILD_TESTING=ON \
            -DASC_CPP_ENABLE_CUDA=OFF \
            -DASC_CPP_WARNINGS_AS_ERRORS=ON \
            -DASCCMake_DIR="$PWD/build/asc-cmake"
          cmake --build build/gcc-release --parallel 2
          ctest --test-dir build/gcc-release --output-on-failure

  linux-clang-current:
    name: Linux / Clang 18 / current CMake / Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out asc-cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: asc-cpp
          persist-credentials: false
      - name: Check out exact private asc-cmake release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AI4SciComp/asc-cmake
          ref: ${{ env.ASC_CMAKE_COMMIT }}
          token: ${{ secrets.ASC_CMAKE_READ_TOKEN }}
          path: asc-cmake
          persist-credentials: false
      - name: Install Clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18 ninja-build
      - name: Report tools and verify asc-cmake
        run: |
          uname -a
          cmake --version
          ctest --version
          clang-18 --version
          clang-format-18 --version
          clang-tidy-18 --version
          test "$(git -C asc-cmake rev-parse HEAD)" = "$ASC_CMAKE_COMMIT"
      - name: Validate formatting and analysis policy
        working-directory: asc-cpp
        run: |
          clang-format-18 --style=file --assume-filename=probe.cc \
            --dump-config >/dev/null
          clang-tidy-18 --config-file=.clang-tidy --verify-config
      - name: Check formatting
        working-directory: asc-cpp
        run: |
          files="$(git ls-files '*.h' '*.cc' '*.cu')"
          if test -n "$files"; then
            clang-format-18 --dry-run --Werror $files
          else
            echo "No C++ source files were found."
          fi
      - name: Configure asc-cmake build-tree package
        run: |
          cmake -S asc-cmake -B build/asc-cmake -G Ninja \
            -DBUILD_TESTING=OFF \
            -DASC_CMAKE_BUILD_TESTING=OFF \
            -DASC_CMAKE_INSTALL=OFF
      - name: Configure, build, and test
        run: |
          cmake -S asc-cpp -B build/clang-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DASC_CPP_BUILD_TESTING=ON \
            -DASC_CPP_ENABLE_CUDA=OFF \
            -DASC_CPP_WARNINGS_AS_ERRORS=ON \
            -DASC_CPP_ENABLE_ADDRESS_SANITIZER=ON \
            -DASC_CPP_ENABLE_UNDEFINED_SANITIZER=ON \
            -DASCCMake_DIR="$PWD/build/asc-cmake"
          cmake --build build/clang-debug --parallel 2
          ctest --test-dir build/clang-debug --output-on-failure \
            --label-exclude "package|consumer"
      - name: Run clang-tidy
        run: |
          files="$(find asc-cpp/src/core asc-cpp/src/utilities \
            asc-cpp/src/dense asc-cpp/src/sparse asc-cpp/src/random \
            -maxdepth 1 -name '*.cc' -print)"
          test -n "$files"
          clang-tidy-18 -p build/clang-debug $files

  windows-msvc-multiconfig:
    name: Windows / VS 2022 / Debug and Release
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Check out asc-cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: asc-cpp
          persist-credentials: false
      - name: Check out exact private asc-cmake release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AI4SciComp/asc-cmake
          ref: ${{ env.ASC_CMAKE_COMMIT }}
          token: ${{ secrets.ASC_CMAKE_READ_TOKEN }}
          path: asc-cmake
          persist-credentials: false
      - name: Report tools and verify asc-cmake
        shell: pwsh
        run: |
          [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
          [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
          cmake --version
          ctest --version
          $actual = git -C asc-cmake rev-parse HEAD
          if ($actual -ne $env:ASC_CMAKE_COMMIT) {
            throw "Unexpected asc-cmake commit: $actual"
          }
      - name: Configure asc-cmake build-tree package
        shell: pwsh
        run: |
          cmake -S asc-cmake -B build/asc-cmake `
            -DBUILD_TESTING=OFF `
            -DASC_CMAKE_BUILD_TESTING=OFF `
            -DASC_CMAKE_INSTALL=OFF
      - name: Configure ASCCpp multi-config
        shell: pwsh
        run: |
          cmake -S asc-cpp -B build/msvc -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_TESTING=ON `
            -DASC_CPP_BUILD_TESTING=ON `
            -DASC_CPP_ENABLE_CUDA=OFF `
            -DASC_CPP_WARNINGS_AS_ERRORS=ON `
            "-DASCCMake_DIR=$pwd/build/asc-cmake"
      - name: Build and test Debug
        shell: pwsh
        run: |
          cmake --build build/msvc --config Debug --parallel 2
          ctest --test-dir build/msvc -C Debug --output-on-failure
      - name: Build and test Release
        shell: pwsh
        run: |
          cmake --build build/msvc --config Release --parallel 2
          ctest --test-dir build/msvc -C Release --output-on-failure

  macos-appleclang:
    name: macOS 15 arm64 / AppleClang / Debug
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out asc-cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: asc-cpp
          persist-credentials: false
      - name: Check out exact private asc-cmake release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AI4SciComp/asc-cmake
          ref: ${{ env.ASC_CMAKE_COMMIT }}
          token: ${{ secrets.ASC_CMAKE_READ_TOKEN }}
          path: asc-cmake
          persist-credentials: false
      - name: Report tools and verify asc-cmake
        run: |
          uname -a
          cmake --version
          ctest --version
          c++ --version
          test "$(git -C asc-cmake rev-parse HEAD)" = "$ASC_CMAKE_COMMIT"
      - name: Configure asc-cmake build-tree package
        run: |
          cmake -S asc-cmake -B build/asc-cmake \
            -DBUILD_TESTING=OFF \
            -DASC_CMAKE_BUILD_TESTING=OFF \
            -DASC_CMAKE_INSTALL=OFF
      - name: Configure, build, and test
        run: |
          cmake -S asc-cpp -B build/appleclang-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DASC_CPP_BUILD_TESTING=ON \
            -DASC_CPP_ENABLE_CUDA=OFF \
            -DASC_CPP_WARNINGS_AS_ERRORS=ON \
            -DASCCMake_DIR="$PWD/build/asc-cmake"
          cmake --build build/appleclang-debug --parallel 2
          ctest --test-dir build/appleclang-debug --output-on-failure
