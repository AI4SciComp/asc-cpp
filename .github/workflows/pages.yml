name: Publish API documentation

on:
  push:
    branches:
      - release/0.9.0
    tags:
      - v0.9.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build strict Doxygen site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          doxygen --version | grep '^1\.9\.8$'
          dot -V
      - name: Generate and validate documentation
        shell: bash
        run: |
          docs_build="$RUNNER_TEMP/asccpp-pages"
          cmake \
            -DASC_CPP_DOCUMENTATION_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DASC_CPP_DOCUMENTATION_BUILD_DIR="$docs_build" \
            -DASC_CPP_DOCUMENTATION_VERSION=0.9.0 \
            -DASC_CPP_DOCUMENTATION_DOXYGEN_EXECUTABLE="$(command -v doxygen)" \
            -P tools/documentation/BuildDoxygen.cmake
          python3 tools/documentation/check_doxygen.py \
            --source "$GITHUB_WORKSPACE" \
            --build "$docs_build" \
            --xml "$docs_build/docs/doxygen/xml" \
            --html "$docs_build/docs/doxygen/html" \
            --tagfile "$docs_build/docs/doxygen/ASCCpp.tag" \
            --warnings "$docs_build/docs/doxygen/doxygen-warnings.log"
          python3 tools/documentation/check_links.py --root "$GITHUB_WORKSPACE"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/asccpp-pages/docs/doxygen/html

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
