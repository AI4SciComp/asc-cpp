schema_version: 1
document:
  title: "MdeCpp disposition ledger for the clean asc-cpp restart"
  prepared_role: "Designer B - MdeCpp migration and provenance"
  source_repository: "git@github.com:escapetiger/MdeCpp.git"
  source_branch: "main"
  source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
  destination_repository: "git@github.com:AI4SciComp/asc-cpp.git"
  destination_branch: "main"
  destination_commit: "33b261ea33616a6395c4ad3b20646093103344f7"
  destination_license: "Apache-2.0"
  approved_modules:
    - "core"
    - "utilities"
    - "expression"
    - "dense"
    - "sparse"
    - "random"
  permitted_direct_dependencies:
    core: []
    utilities:
      - "core"
    expression:
      - "core"
    dense:
      - "core"
      - "expression"
    sparse:
      - "core"
      - "expression"
    random:
      - "core"
  integration_facets:
    random_dense:
      owner: "random"
      direct_dependencies:
        - "random"
        - "dense"
    random_sparse:
      owner: "random"
      direct_dependencies:
        - "random"
        - "sparse"
  default_reuse_rule: >-
    Do not copy MdeCpp source or tests. Reimplement approved behavior
    independently from reviewed contracts or authoritative upstream
    specifications unless the owner separately approves a compatible grant,
    attribution, and notice plan.
  non_evidence:
    - "MdeCpp/Makefile in the worktree, because it is locally modified"
    - "MdeCpp/legacy and MdeCpp/develop, because the tracked .gitignore excludes them"
    - "local MdeCpp build and Testing artifacts"
    - "the broken tracked absolute symlink miniapps/vpfp/vpfp1d"
    - "deleted asc-cpp implementation, test, build, and notice files"
    - "retained asc-cpp five-component documents as current authority"

records:
  - id: "MDE-001"
    source: "generic/core/{casts,error,globals,numeric,operators,string}.{h,cc}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: >-
      Numeric vocabulary, checked casts, string helpers, failure categories,
      and diagnostic entry points.
    destination_module: "core"
    destination_owner: "asc-cpp/core"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      The concepts are foundational, but compile-time exception-versus-abort
      macros and global diagnostic streams conflict with explicit status,
      result, contract, and diagnostic-sink policy.
    license: "MdeCpp repository GPLv3 working assumption; asc-cpp Apache-2.0"
    provenance: "Project-authored headers identify MdeCpp team or Yi Cai; no per-file SPDX grant."
    tests_to_preserve:
      - "checked-cast boundary and overflow cases"
      - "error category and message-context cases"
      - "numeric trait/type coverage"
    blockers:
      - "Status/result and diagnostics ADR required."
      - "No source copying without a compatible rightsholder grant."
    notes: "Preserve failure categories, not macro names or process-global streams."

  - id: "MDE-002"
    source: "generic/array/{mshape,mindex,miterator,mlayout}.{h,cc}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: >-
      Rank, shape, logical-index iteration, layout mapping, size calculation,
      and validation behavior shared by numerical storage.
    destination_module: "core"
    destination_owner: "asc-cpp/core"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      Shape and checked index vocabulary can be storage-neutral. MdeCpp uses
      int extents and a combined array hierarchy, so the representation and
      public protocol must be newly designed.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored in the pinned tree; no per-file SPDX grant."
    tests_to_preserve:
      - "rank-zero size semantics"
      - "zero and negative extent handling"
      - "extent product overflow"
      - "row-major, column-major, permutation, and strided offset checks"
    blockers:
      - "Index width and mixed static/dynamic extent policy require approval."
    notes: "Only storage-neutral descriptors belong in core; dense and sparse own storage mappings."

  - id: "MDE-003"
    source: "generic/device/{device,memory,memory_impl,forall}.{h,cc}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: >-
      Host/device allocation, ownership and reference modes, backend selection,
      loop dispatch, copies, and host/device data access.
    destination_module: "core"
    destination_owner: "asc-cpp/core"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      MdeCpp uses a non-thread-safe process singleton, environment-controlled
      global configuration, a global memory manager, and implicit transfer on
      Read/Write. The approved contract requires explicit resources, contexts,
      copies, events, and lifetimes.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored in the pinned tree; architectural influence from MFEM is documented elsewhere but file-level lineage is not inventoried."
    tests_to_preserve:
      - "allocate/deallocate and zero-size behavior"
      - "owning versus referring memory"
      - "copy and move lifetime behavior"
      - "CPU/provider parity"
      - "unavailable-provider handling"
    blockers:
      - "Memory/resource/context/event ADRs required."
      - "MFEM-derived lineage, if any source adaptation is proposed, requires file-level review."
    notes: "Implicit synchronization and global backend selection are rejected behaviors."

  - id: "MDE-004"
    source: "generic/device/{cuda.h,cuda.cc}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "CUDA allocation, copy, device query, and error-adapter behavior."
    destination_module: "core"
    destination_owner: "asc-cpp/core provider facet"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      CUDA is an optional provider. Vendor headers and types must not leak into
      common public core headers or make the base component require a CUDA SDK.
    license: "MdeCpp repository GPLv3 working assumption; CUDA SDK terms apply to provider use"
    provenance: "Project wrapper code in the pinned tree; vendor API dependency is explicit."
    tests_to_preserve:
      - "provider capability query"
      - "allocation/copy failure propagation"
      - "runtime-unavailable skip reporting"
    blockers:
      - "Provider ABI and public-header isolation policy required."
    notes: "CUDA support is optional and explicit, not a default global mode."

  - id: "MDE-005"
    source: "generic/utility/{config.h,config.cc} - ConfigValue and schema portions"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Typed configuration values, named entries, defaults, and validators."
    destination_module: "core"
    destination_owner: "asc-cpp/core"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      A storage-independent configuration model is shared vocabulary. MdeCpp
      directly stores DVector and DMatrix and silently permits some numeric
      conversion, creating forbidden storage coupling and ambiguous conversion.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored in the pinned tree."
    tests_to_preserve:
      - "bool, integer, real, string, sequence, and nested-sequence values"
      - "default and validator behavior"
      - "missing-key and wrong-type failures"
    blockers:
      - "Approved value-domain and conversion policy required."
    notes: "Use standard containers or serialization values, never dense or sparse types."

  - id: "MDE-006"
    source: "generic/utility/{config.h,config.cc} - text and file parsing portions"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Configuration text parsing, comment removal, key/value loading, and validation."
    destination_module: "utilities"
    destination_owner: "asc-cpp/utilities"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      Parsing is a utility, but must consume only the core value/schema model.
      MdeCpp mutates as it parses, admits unknown keys, and has no complete
      duplicate, rollback, or diagnostics contract.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored in the pinned tree."
    tests_to_preserve:
      - "comments and whitespace"
      - "scalar and sequence parsing"
      - "file-open, malformed-line, type, and validation failures"
    blockers:
      - "Unknown-key, duplicate-key, and transactional-update policy required."
    notes: "utilities must remain independent of dense, sparse, and expression."

  - id: "MDE-007"
    source: "generic/utility/{optparser.h,optparser.cc}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Short/long options, switches, values, help, usage, and option files."
    destination_module: "utilities"
    destination_owner: "asc-cpp/utilities"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      The behavior is useful, but the bound-pointer interface, truncated short
      option buffer, negative-value parsing, and incomplete token/error
      semantics should not become the new contract.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored in the pinned tree."
    tests_to_preserve:
      - "defaults, switches, long and short forms"
      - "mixed and repeated options"
      - "missing option values"
      - "help and usage rendering"
      - "file-fed arguments"
      - "numeric and string values"
    blockers:
      - "Specify negative values, --, unknown tokens, duplicates, rollback, and value lifetimes."
    notes: "Add independent negative and transactional tests missing from MdeCpp."

  - id: "MDE-008"
    source: "generic/utility/{timer.h,timer.cc}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Steady-clock timing, start/stop, recent sample, and averaging."
    destination_module: "utilities"
    destination_owner: "asc-cpp/utilities"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      steady_clock is appropriate, but fixed sample capacity, unchecked empty
      access, and the Stop post-increment indexing defect make the source
      unsuitable.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored in the pinned tree."
    tests_to_preserve:
      - "start, stop, reset, lap, and accumulated duration"
      - "monotonic duration"
      - "capacity behavior"
    blockers:
      - "Timer state-machine and empty-access contract required."
    notes: "MdeCpp has no direct timer unit-test suite; derive tests from a new specification."

  - id: "MDE-009"
    source: "generic/array/{carray.h,uarray.h,uarray.cc}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Fixed and dynamic sequence ownership, references, iterators, resize, and serialization."
    destination_module: "utilities"
    destination_owner: "asc-cpp/utilities"
    disposition: "specification-only"
    reuse_mode: "concept-evaluation"
    rationale: >-
      Only a thin storage-independent wrapper that materially improves on
      standard containers belongs in utilities. Reusing UArray as common
      numerical storage would couple utilities, dense, and sparse.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored in the pinned tree."
    tests_to_preserve:
      - "zero size and checked indexing"
      - "owning/reference distinction"
      - "copy/move and iterator behavior"
      - "save/load error handling"
    blockers:
      - "Demonstrate value beyond std::array, std::span, and std::vector."
    notes: "Reject UArray as a shared dense/sparse implementation dependency."

  - id: "MDE-010"
    source: "generic/array/{expr.h,concepts.h} - expression portions"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: >-
      Unary/binary/scalar expression composition, shape propagation,
      broadcasting, promotion, and evaluation entry points.
    destination_module: "expression"
    destination_owner: "asc-cpp/expression"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      MdeCpp expressions know concrete dense/sparse categories, memory access,
      device dispatch, and destination evaluation. The new module must contain
      only storage-neutral nodes, protocols, and metadata.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored in the pinned tree; no external-type evidence."
    tests_to_preserve:
      - "unary, binary, and scalar composition"
      - "shape propagation and broadcasting"
      - "result-type promotion"
      - "nested-node lifetime"
    blockers:
      - "Storage-neutral terminal/evaluator protocol ADR required."
    notes: "Dense and sparse each own terminals and evaluators; expression never allocates or transfers."

  - id: "MDE-011"
    source: "generic/array/{dsmarray.h,dsmarray_impl.h,dsmarray.cc,mobject.h,mobject_impl.h}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: >-
      Dense ownership and references, shape/layout metadata, slicing,
      transposition, permutation, copy/move/resize, reduction, and
      serialization.
    destination_module: "dense"
    destination_owner: "asc-cpp/dense"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      DenseMArray conflates owner and view modes and inherits implicit
      Memory/Device synchronization. Dense needs distinct owners/views,
      explicit resources and contexts, and dense-owned evaluation.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored in the pinned tree."
    tests_to_preserve:
      - "owning and borrowed lifetime behavior"
      - "row-major, column-major, and strided access"
      - "slice, nested slice, transpose, and permutation"
      - "copy, move, resize, reduction, and serialization"
      - "zero extent, invalid shape, and bounds failures"
    blockers:
      - "Dense owner/view, alias, and transfer contracts required."
    notes: "Do not reproduce the MArrayView-as-DenseMArray alias."

  - id: "MDE-012"
    source: "generic/array/{spmarray.h,spmarray_impl.h,spmlayout.h,spmindex.h,spmiterator.h}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: >-
      COO/CSR/CSC construction, validation, duplicate combination, zero
      removal, format conversion, transpose, slicing, diagonal, arithmetic,
      and multi-rank sparse behavior.
    destination_module: "sparse"
    destination_owner: "asc-cpp/sparse"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      MdeCpp couples sparse to dense concepts and shared UArray storage and
      exposes inconsistent low-rank aliases. Sparse must own formats,
      builders, views, evaluators, and algorithms independently.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored in the pinned tree."
    tests_to_preserve:
      - "COO/CSR/CSC structure validation"
      - "duplicate summation and explicit-zero policy"
      - "sortedness and format conversion"
      - "transpose, slice, diagonal, arithmetic, and compact"
      - "invalid indices, overflow, empty structures, and multi-rank behavior"
    blockers:
      - "Index base/width, canonicalization, rank, and complexity contracts required."
    notes: "No dense return or parameter types in the base sparse component."

  - id: "MDE-013"
    source: "generic/array/{concepts.h,marray.h,forwards.h}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Combined dense/sparse traits, aliases, concepts, and umbrella inclusion."
    destination_module: null
    destination_owner: "none"
    disposition: "reject"
    reuse_mode: "none"
    rationale: >-
      The combined layer directly violates dense/sparse independence and would
      reintroduce a forbidden array super-module.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored in the pinned tree."
    tests_to_preserve:
      - "compile-time positive and negative concept cases, re-expressed per owner"
    blockers: []
    notes: "Split vocabulary among core, expression, dense, and sparse; do not create an array destination."

  - id: "MDE-014"
    source: "algebra/{blas.h,decomp.h,lapack.h,types.h} - dense operations"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: >-
      Dense vector/matrix elementwise operations, BLAS operations,
      decompositions, factorization, and solver contracts.
    destination_module: "dense"
    destination_owner: "asc-cpp/dense"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      Dense storage owns dense linalg. MdeCpp's TensorLike layer spans dense
      and sparse, so the interfaces and implementation must be split.
    license: "MdeCpp repository GPLv3 working assumption; provider licenses require separate review"
    provenance: "Project wrappers in the pinned tree; algorithm/provider lineage is not inventoried per file."
    tests_to_preserve:
      - "small exact BLAS references"
      - "layout, transpose, conjugate, alpha/beta, and alias cases"
      - "decomposition reconstruction and orthogonality"
      - "solver residual, reuse, multiple RHS, singular, and rectangular cases"
    blockers:
      - "Operation semantics and provider-dispatch ADR required."
      - "Provider licenses and notices must be recorded before enabling adapters."
    notes: "There is no linalg module."

  - id: "MDE-015"
    source: "algebra/{blas.h,eigen.h,types.h} - sparse operations and adapters"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Sparse algebra, provider conversion, and sparse solver behavior."
    destination_module: "sparse"
    destination_owner: "asc-cpp/sparse"
    disposition: "redesign"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      Sparse linalg and provider adapters belong to sparse and must not depend
      on dense ownership. MdeCpp's Eigen adapter includes both families and
      exposes a combined algebra surface.
    license: "MdeCpp repository GPLv3 working assumption; Eigen MPL2 and optional MKL terms require exact-version review"
    provenance: "Project wrapper code with external provider dependencies; no locked dependency manifest was found."
    tests_to_preserve:
      - "sparse provider conversion round trips"
      - "sparse solver residual and failure behavior"
      - "format and index-width compatibility"
    blockers:
      - "Exact provider versions, licenses, notices, and ABI policy required."
    notes: "Keep provider types out of common sparse headers where practical."

  - id: "MDE-016"
    source: "random/generator.h - Generator wrapper and standard distributions"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Engine ownership, seed/reset, uniform and normal scalar generation."
    destination_module: "random"
    destination_owner: "asc-cpp/random"
    disposition: "approved-design"
    reuse_mode: "behavioral-reimplementation"
    rationale: >-
      Base random can own explicit deterministic state, but MdeCpp's default
      Reset obtains entropy implicitly and standard distributions do not define
      a portable sequence guarantee.
    license: "Mixed upstream terms inside a GPLv3 repository; see MDE-017 and provenance review"
    provenance: "Wrapper is project-authored; engine bodies include upstream attribution comments."
    tests_to_preserve:
      - "same explicit state gives the same sequence"
      - "min/max and range behavior"
      - "reset and exact-width state export/import"
    blockers: []
    notes: >-
      Issue 12 freezes explicit nondeterministic acquisition, exact-width
      versioned state, and no byte serialization for 0.9.x. TimeSeed is
      rejected.

  - id: "MDE-017"
    source: "random/generator.h - SplitMix64, PCG32, xoroshiro64*, xoroshiro128+"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Small-state pseudorandom engine transition and output functions."
    destination_module: "random"
    destination_owner: "asc-cpp/random"
    disposition: "approved-design"
    reuse_mode: "clean-room-authoritative-specification"
    rationale: >-
      The local file records public-domain/MIT claims for Blackman/Vigna
      algorithms and an Apache-2.0 notice for PCG32, but asc-cpp currently has
      no third-party notice and MdeCpp's local adaptation remains covered by
      the repository's GPLv3 working assumption. Issue 12 pins exact
      authoritative public-domain and Apache-2.0 artifacts instead.
    license: "SplitMix/xoroshiro upstream public-domain dedication; PCG32 0.9 upstream Apache-2.0; local MdeCpp adaptation rejected"
    provenance: >-
      Issue 12 random-crosswalk.yaml freezes exact upstream URLs and SHA-256
      identities. Implementation is independently authored from those
      specifications and never from MdeCpp.
    tests_to_preserve:
      - "authoritative fixed-seed engine vectors"
      - "all-zero-state rejection where applicable"
      - "jump/partition vectors if the approved version supports them"
    blockers: []
    notes: >-
      SplitMix64 2015, PCG32 XSH-RR set-sequence 0.9, xoroshiro64* 1.0,
      and xoroshiro128+ 1.0 parameters 24,16,37 are the only approved
      stateful engine variants.

  - id: "MDE-018"
    source: "random/{permutation.h,permutation.cc,halton.h,hammersley.h}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Prime generation, digit permutations, Halton and Hammersley low-discrepancy sampling."
    destination_module: "random"
    destination_owner: "asc-cpp/random"
    disposition: "approved-design"
    reuse_mode: "clean-room-mathematical-specification"
    rationale: >-
      Low-discrepancy scalar/index mathematics belongs in base random, but
      MdeCpp uses hidden mutable singleton caches. State and caches must be
      caller-owned, immutable, or explicitly injected.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored files; mathematical source references and exact algorithm variants are not fully inventoried."
    tests_to_preserve:
      - "prime and permutation validity"
      - "early Halton/Hammersley points from independent formulas"
      - "dimension/index/range validation"
      - "concurrent deterministic use"
    blockers: []
    notes: >-
      Issue 12 approves stateless prime/radical-inverse helpers and explicit
      caller-owned permutation spans. Singleton cache behavior remains
      rejected.

  - id: "MDE-019"
    source: "random/{sobol.h,sobol.cc,data/sobol.txt,data/sobol.bin,data/convert_sobol_to_binary.py}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Sobol sequence generation through polynomial and direction-number data."
    destination_module: "random"
    destination_owner: "asc-cpp/random"
    disposition: "approved-design"
    reuse_mode: "clean-room-plus-compatible-data"
    rationale: >-
      MdeCpp Sobol source and all three data artifacts remain rejected. Issue
      12 instead approves an original Joe-Kuo recurrence implementation and
      the exact new-joe-kuo-6.21201 input under its verified BSD-style grant.
    license: "MdeCpp artifacts rejected; exact Joe-Kuo data and program BSD-3-Clause-style with retained notice"
    provenance: >-
      Historical derivation is strongly indicated from John Burkardt's Sobol
      source. The approved replacement is the Kuo/Joe authoritative D6
      dataset pinned in Issue 12 random-crosswalk.yaml.
    tests_to_preserve:
      - "only independently derived Sobol reference vectors after an exact version is approved"
      - "dimension and index bounds"
      - "sequence reset/index behavior"
      - "input, license, generator, generated, install, and compiled-table identities"
    blockers: []
    notes: >-
      Pinned hashes: sobol.txt
      16722f0f9978c1d4f5f0cfc67228f5417f217f4fa30bc7666a03e10d52bd3e14;
      sobol.bin
      836668fdbb3b72fabc0f0d07febfa06d9b022bed59b51d8eb5e5deed32a4b3cd;
      converter
      f43157752ad613be02b0e5c2271fcd801f0f5695f6f4b85b2d17cf5a5f8ceda2.
      These identify rejected evidence. The approved replacement input is
      68eedd2a4e3b659b9695e7aff0f8ac68718bcf620730fc3d3a8c65df2a067441.

  - id: "MDE-020"
    source: "random/{sampler.h,pseudo.h,latin.h,normal.h,spherical.h}"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Dense-output pseudo, Latin, normal, and spherical sampling."
    destination_module: "random"
    destination_owner: "asc-cpp/random_dense facet"
    disposition: "approved-design"
    reuse_mode: "clean-room-behavioral-reimplementation"
    rationale: >-
      These samplers include MdeCpp array and sometimes algebra facilities.
      Allocation, dense views, and dense linalg belong in a separately linked
      random_dense facet, never the base random target.
    license: "MdeCpp repository GPLv3 working assumption"
    provenance: "Project-authored wrappers; exact mathematical references are incomplete."
    tests_to_preserve:
      - "shape and range validation"
      - "same explicit state gives the same logical sample"
      - "normal/spherical geometric invariants"
      - "layout-independent logical fill order"
    blockers: []
    notes: >-
      Issue 12 keeps scalar algorithms in random and all Dense views,
      factorization, BLAS, and hypersphere output in random_dense. The base
      remains core-only.

  - id: "MDE-021"
    source: "No adequate MdeCpp sparse-random source"
    source_commit: "f6294e9079262682ce63ae7ff2d8a643e658bf5d"
    behavior: "Sparse pattern and sparse value generation."
    destination_module: "random"
