capabilities:
  - capability: "incremental Reference-LAPACK LU provider"
    owner: "dense"
    facet: "dense_lapack"
    development_stage: 4
    status: "runtime-tested"
    evidence_scope: "unreleased incremental-lu-v3; frozen8c53d8d full LP64/trueILP64 each285 tests with zero skips, including installed both-layout consumers; final routine/mode contract-bound coverage remains pending"
    public_headers:
      - "include/asc/dense/providers/lapack.h"
      - "include/asc/dense/providers/lapack_export.h"
      - "include/asc/dense/providers/lapack_lu.h"
      - "include/asc/dense/providers/lapack_lu_equilibration.h"
    direct_dependencies:
      - "dense"
    tests:
      - "actual S/D/C/Z GETRF reconstruction and GETRS N/T/C residuals"
      - "raw INFO, ABI, explicit integer workspace and preflight failures"
      - "actual GETRF2/GETF2 reconstruction, GETRI two-sided inverse residual and GESV driver residual"
      - "GEEQU/GEEQUB both-layout equations and partial outputs; LP64 subnormal GEEQUB success gate unmet"
    guarantees:
      - "explicit provider selection; provider-free aggregate remains independent"
    non_guarantees:
      - "full Reference-LAPACK profile"
      - "shared providers or unaudited toolchains"
      - "successful GEEQUB equilibration for the recorded nonzero LP64 subnormal fixture"

